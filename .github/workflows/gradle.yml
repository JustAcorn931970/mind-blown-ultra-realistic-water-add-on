
name: Build Wind Blower JAR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Minecraft 26.3 + Fabric
    runs-on: ubuntu-24.04

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-provider: basic

      - name: Build mod against Minecraft and Fabric
        run: gradle --no-daemon --stacktrace clean build

      - name: Verify the 1.4.0 JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='build/libs/windblower-26.3-1.4.0.jar'
          test -f "$JAR"
          jar tf "$JAR" > "$RUNNER_TEMP/jar-contents.txt"
          grep -qx 'fabric.mod.json' "$RUNNER_TEMP/jar-contents.txt"
          unzip -p "$JAR" fabric.mod.json > "$RUNNER_TEMP/fabric.mod.json"
          grep -q '"version": "1.4.0"' "$RUNNER_TEMP/fabric.mod.json"
          echo 'JAR structure and mod version verified; in-game behavior still needs testing.'

      - name: Upload the built JAR directly
        uses: actions/upload-artifact@v7
        with:
          name: Wind-Blower-1.4.0-Physics-GUI-WaterCompat-JAR
          path: build/libs/windblower-26.3-1.4.0.jar
          archive: false
          if-no-files-found: error
          retention-days: 14
